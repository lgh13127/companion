name: Export Companion Docker Image

on:
  workflow_dispatch:          # 允许手动触发

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Companion image from GitHub Container Registry
        run: |
          docker pull ghcr.io/bitfocus/companion/companion:latest

      - name: Save image to tar file
        run: |
          docker save ghcr.io/bitfocus/companion/companion:latest -o companion.tar

      - name: Upload tar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-image
          path: companion.tar
